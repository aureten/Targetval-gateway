name: targetval-drughunter-audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/targetval-drughunter-audit.yml
      - scripts/targetval_drughunter_audit.py

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ten-case live audit
        env:
          TARGETVAL_BASE_URL: https://targetval-api.onrender.com
        run: python scripts/targetval_drughunter_audit.py
      - name: Upload complete audit responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targetval-drughunter-audit
          path: audit_results/
          if-no-files-found: warn
          retention-days: 7
